apiVersion: 1
datasources:
  - name: Compactor Postgres
    uid: compactor-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: ${DB_USER}
    isDefault: true
    secureJsonData:
      password: ${DB_PASS}
    jsonData:
      database: ${DB_NAME}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
