<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hackathon 2026</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Hackathon 2026</h1>
    <p class="tagline">TODO: one-line pitch</p>

    <form id="predict-form">
      <label for="input-text">Your input</label>
      <textarea id="input-text" rows="4" placeholder="Type something…" required></textarea>
      <button type="submit">Analyze</button>
    </form>

    <section id="result" hidden>
      <h2 id="result-label"></h2>
      <p>Score: <strong id="result-score"></strong></p>
      <p id="result-explanation"></p>
      <small id="result-model"></small>
    </section>

    <p id="error" role="alert" hidden></p>
    <footer>API: <span id="api-status">checking…</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
