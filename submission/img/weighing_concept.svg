<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Weigh at Source: sensor placement on a DUO compactor</title>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="600" fill="#0f2a3d">Weigh at Source — sensor placement (DUO type shown; COMBI identical at its feet)</text>

  <!-- ground -->
  <line x1="30" y1="360" x2="870" y2="360" stroke="#555" stroke-width="2"/>
  <!-- compactor unit -->
  <rect x="60" y="190" width="200" height="160" rx="6" fill="#d9e3ea" stroke="#2f4858" stroke-width="2"/>
  <text x="160" y="215" text-anchor="middle" font-weight="600" fill="#2f4858">Compactor (stays on site)</text>
  <!-- ram + cylinder -->
  <rect x="85" y="255" width="120" height="30" fill="#9fb3c0" stroke="#2f4858"/>
  <text x="145" y="275" text-anchor="middle" font-size="12" fill="#1d2d38">hydraulic ram</text>
  <rect x="205" y="262" width="55" height="16" fill="#6c8796"/>
  <!-- pressure sensor -->
  <circle cx="120" cy="320" r="11" fill="#e8833a" stroke="#7a3a0b" stroke-width="2"/>
  <text x="120" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">P</text>
  <!-- SMART controller -->
  <rect x="160" y="305" width="85" height="34" rx="4" fill="#0f2a3d"/>
  <text x="202" y="322" text-anchor="middle" font-size="11" fill="#fff">SMART ctrl</text>
  <text x="202" y="334" text-anchor="middle" font-size="10" fill="#b9c7d3">+ weighing ADC</text>

  <!-- container -->
  <path d="M270 170 L700 170 L720 335 L270 335 Z" fill="#cfe5d3" stroke="#2c6e3f" stroke-width="2"/>
  <text x="495" y="200" text-anchor="middle" font-weight="600" fill="#1f4d2c">Detachable container (20–30 m³)</text>
  <text x="495" y="222" text-anchor="middle" font-size="12" fill="#2c6e3f">compacted cardboard / plastic, up to ~4 t</text>
  <!-- waste fill -->
  <path d="M275 250 L708 250 L718 330 L275 330 Z" fill="#a9cfb0" opacity="0.8"/>
  <!-- rails -->
  <rect x="270" y="335" width="460" height="10" fill="#6b6b6b"/>
  <!-- load sensors -->
  <g fill="#e8833a" stroke="#7a3a0b" stroke-width="2">
    <rect x="290" y="345" width="34" height="15" rx="2"/>
    <rect x="420" y="345" width="34" height="15" rx="2"/>
    <rect x="550" y="345" width="34" height="15" rx="2"/>
    <rect x="680" y="345" width="34" height="15" rx="2"/>
  </g>
  <text x="502" y="385" text-anchor="middle" font-size="13" font-weight="600" fill="#7a3a0b">4 × low-profile load sensors (weigh bars) under the container rails / feet</text>
  <!-- signal lines -->
  <path d="M307 345 L307 300 L245 300" fill="none" stroke="#7a3a0b" stroke-dasharray="4 3"/>
  <path d="M120 309 L120 300 L160 300 L160 305" fill="none" stroke="#7a3a0b" stroke-dasharray="4 3"/>

  <!-- cloud -->
  <rect x="745" y="70" width="130" height="70" rx="10" fill="#eef3ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="810" y="98" text-anchor="middle" font-weight="600" fill="#1f4fb3">SMART cloud</text>
  <text x="810" y="118" text-anchor="middle" font-size="11" fill="#1f4fb3">calibration + cockpit</text>
  <path d="M245 315 L264 315 L264 140 L743 140 L743 112" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="500" y="130" text-anchor="middle" font-size="12" fill="#1f4fb3">weight at rest, fill %, ram pressure, temperature → existing SMART link</text>

  <!-- weighbridge feedback -->
  <rect x="745" y="250" width="130" height="62" rx="8" fill="#fff6e8" stroke="#b07b18" stroke-width="2"/>
  <text x="810" y="276" text-anchor="middle" font-weight="600" fill="#7a5410">Weighbridge</text>
  <text x="810" y="294" text-anchor="middle" font-size="11" fill="#7a5410">ticket (when shared)</text>
  <path d="M810 250 L810 142" fill="none" stroke="#b07b18" stroke-width="2" marker-end="url(#a)"/>
  <text x="818" y="200" font-size="11" fill="#7a5410">self-</text>
  <text x="818" y="214" font-size="11" fill="#7a5410">calibration</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b07b18"/></marker></defs>

  <!-- legend -->
  <rect x="30" y="405" width="840" height="50" rx="6" fill="#f6f7f9" stroke="#e3e6ea"/>
  <rect x="45" y="420" width="18" height="12" fill="#e8833a" stroke="#7a3a0b"/>
  <text x="70" y="431" font-size="12">new sensors (retrofit, bolt-on)</text>
  <text x="300" y="424" font-size="12">• Weigh only at rest (ram retracted, no door/lift movement)</text>
  <text x="300" y="442" font-size="12">• Auto-zero after every emptying (empty container = known tare) → drift check each lift</text>
</svg>
