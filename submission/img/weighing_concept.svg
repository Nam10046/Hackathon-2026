<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f4f6f"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9aa5ad" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="24" y="34" font-size="20" font-weight="700" fill="#1d2b36">Weigh at Source — DUO side view (COMBI: see box on the right)</text>
  <text x="24" y="56" fill="#55636e">4 × 10 t C3 shear-beam cells under the docking frame · weigh only at idle · RFID tare register · RS-485 into SMART</text>

  <!-- ground -->
  <rect x="24" y="392" width="640" height="18" fill="url(#hatch)"/>
  <line x1="24" y1="392" x2="664" y2="392" stroke="#5b6770" stroke-width="2"/>

  <!-- compactor (stays) -->
  <rect x="40" y="250" width="150" height="142" rx="6" fill="#dfe7ee" stroke="#2f4f6f" stroke-width="2"/>
  <text x="125" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2b36">DUO compactor</text>
  <text x="125" y="286" text-anchor="middle" font-size="12" fill="#55636e">stays on site</text>
  <rect x="110" y="312" width="70" height="18" fill="#b7c6d3" stroke="#2f4f6f"/>
  <text x="145" y="350" text-anchor="middle" font-size="12" fill="#55636e">ram (retracted</text>
  <text x="145" y="364" text-anchor="middle" font-size="12" fill="#55636e">when weighing)</text>
  <!-- SMART controller -->
  <rect x="52" y="300" width="50" height="40" rx="4" fill="#fff4d6" stroke="#b07d00" stroke-width="1.5"/>
  <text x="77" y="317" text-anchor="middle" font-size="11" font-weight="700" fill="#6b4c00">SMART</text>
  <text x="77" y="331" text-anchor="middle" font-size="11" fill="#6b4c00">ctrl</text>

  <!-- container -->
  <rect x="200" y="210" width="400" height="140" rx="8" fill="#eef4e8" stroke="#3c6b2c" stroke-width="2"/>
  <text x="400" y="240" text-anchor="middle" font-weight="700" fill="#1d2b36">Detachable container (swapped between sites)</text>
  <text x="400" y="260" text-anchor="middle" fill="#55636e">empty ≈ 4.5 t · material up to ≈ 10 t</text>
  <rect x="215" y="275" width="370" height="62" fill="#d6e6c8" stroke="none"/>
  <text x="400" y="311" text-anchor="middle" fill="#3c6b2c">compacted material</text>
  <!-- RFID tag on container -->
  <rect x="560" y="218" width="30" height="16" rx="3" fill="#ffd9d9" stroke="#b03030"/>
  <text x="575" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#b03030">TAG</text>

  <!-- docking frame on cells -->
  <rect x="200" y="350" width="400" height="14" fill="#c9cfd4" stroke="#2f4f6f" stroke-width="1.5"/>
  <text x="610" y="361" font-size="11" fill="#55636e">docking frame / rails</text>
  <!-- 4 cells (2 visible + 2 behind) -->
  <g fill="#2f80c0" stroke="#164a73" stroke-width="1.5">
    <rect x="225" y="364" width="46" height="16" rx="2"/>
    <rect x="529" y="364" width="46" height="16" rx="2"/>
  </g>
  <!-- base plates -->
  <rect x="215" y="380" width="66" height="12" fill="#7d8890"/>
  <rect x="519" y="380" width="66" height="12" fill="#7d8890"/>
  <!-- overload stop marks -->
  <rect x="285" y="370" width="10" height="22" fill="#e0a000" stroke="#7a5600"/>
  <rect x="505" y="370" width="10" height="22" fill="#e0a000" stroke="#7a5600"/>

  <!-- callouts for cells -->
  <line x1="248" y1="420" x2="248" y2="382" stroke="#164a73" marker-end="url(#arr)"/>
  <text x="140" y="440" fill="#164a73" font-weight="700">4 × 10 t C3 shear beams</text>
  <text x="140" y="456" fill="#164a73">(2 shown) in mounting kits:</text>
  <text x="140" y="472" fill="#164a73">lift-off + horizontal stops</text>
  <line x1="510" y1="420" x2="510" y2="394" stroke="#7a5600" marker-end="url(#arr)"/>
  <text x="420" y="440" fill="#7a5600" font-weight="700">overload stop at 110 %</text>
  <text x="420" y="456" fill="#7a5600">takes pick-up / set-down peaks</text>
  <text x="420" y="472" fill="#7a5600">(cell max 11 t, safe 15 t)</text>

  <!-- RFID reader at dock -->
  <rect x="620" y="200" width="34" height="40" rx="3" fill="#ffd9d9" stroke="#b03030" stroke-width="1.5"/>
  <text x="637" y="224" text-anchor="middle" font-size="10" font-weight="700" fill="#b03030">RFID</text>
  <line x1="620" y1="226" x2="594" y2="226" stroke="#b03030" stroke-dasharray="3,3"/>
  <text x="637" y="256" text-anchor="middle" font-size="11" fill="#b03030">reads ID</text>

  <!-- transmitter -->
  <rect x="40" y="168" width="150" height="58" rx="5" fill="#e8f1fa" stroke="#2f80c0" stroke-width="1.5"/>
  <text x="115" y="190" text-anchor="middle" font-weight="700" fill="#164a73">4-ch 24-bit transmitter</text>
  <text x="115" y="207" text-anchor="middle" font-size="12" fill="#164a73">per-cell diagnostics</text>
  <text x="115" y="221" text-anchor="middle" font-size="12" fill="#164a73">RS-485 Modbus</text>
  <path d="M248,364 C248,330 200,250 190,215" fill="none" stroke="#2f80c0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="60" y1="226" x2="60" y2="298" stroke="#2f80c0" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M620,232 C560,160 300,150 190,185" fill="none" stroke="#b03030" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- cloud -->
  <rect x="40" y="80" width="300" height="66" rx="10" fill="#fff4d6" stroke="#b07d00" stroke-width="1.5"/>
  <text x="190" y="102" text-anchor="middle" font-weight="700" fill="#6b4c00">SMART cloud + our backend</text>
  <text x="190" y="120" text-anchor="middle" font-size="12" fill="#6b4c00">net = gross − tare(ID) · status MEASURED /</text>
  <text x="190" y="136" text-anchor="middle" font-size="12" fill="#6b4c00">MODEL_ESTIMATE / UNVERIFIABLE · cockpit</text>
  <polyline points="52,330 28,330 28,113 38,113" fill="none" stroke="#b07d00" stroke-width="2" marker-end="url(#arr)"/>
  <text x="20" y="262" font-size="11" fill="#6b4c00" transform="rotate(-90 20 262)">existing modem</text>

  <!-- weighbridge -->
  <rect x="380" y="80" width="250" height="66" rx="10" fill="#f2f2f2" stroke="#7d8890" stroke-width="1.5"/>
  <text x="505" y="102" text-anchor="middle" font-weight="700" fill="#3d474f">Operator weighbridge</text>
  <text x="505" y="120" text-anchor="middle" font-size="12" fill="#3d474f">single-load, WEIGHED-tare tickets only</text>
  <text x="505" y="136" text-anchor="middle" font-size="12" fill="#3d474f">→ drift check, never auto re-scale</text>
  <line x1="380" y1="113" x2="344" y2="113" stroke="#7d8890" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- COMBI box -->
  <rect x="690" y="80" width="290" height="230" rx="10" fill="#fafafa" stroke="#5b6770" stroke-width="1.5"/>
  <text x="835" y="104" text-anchor="middle" font-weight="700" fill="#1d2b36">COMBI (press + container lifted as one)</text>
  <rect x="725" y="140" width="220" height="90" rx="8" fill="#eef4e8" stroke="#3c6b2c" stroke-width="2"/>
  <rect x="725" y="140" width="60" height="90" rx="6" fill="#dfe7ee" stroke="#2f4f6f" stroke-width="2"/>
  <text x="755" y="190" text-anchor="middle" font-size="11" fill="#1d2b36">press</text>
  <text x="865" y="190" text-anchor="middle" font-size="11" fill="#1d2b36">container</text>
  <rect x="915" y="146" width="24" height="14" rx="3" fill="#ffd9d9" stroke="#b03030"/>
  <text x="927" y="157" text-anchor="middle" font-size="9" font-weight="700" fill="#b03030">TAG</text>
  <rect x="715" y="230" width="240" height="10" fill="#c9cfd4" stroke="#2f4f6f"/>
  <g fill="#2f80c0" stroke="#164a73"><rect x="730" y="240" width="34" height="12" rx="2"/><rect x="906" y="240" width="34" height="12" rx="2"/></g>
  <line x1="705" y1="252" x2="965" y2="252" stroke="#5b6770" stroke-width="2"/>
  <text x="835" y="272" text-anchor="middle" font-size="12" fill="#55636e">ground weigh frame with 4 weigh pads</text>
  <text x="835" y="288" text-anchor="middle" font-size="12" fill="#55636e">stays on site · tare = whole unit (by RFID)</text>
  <text x="835" y="303" text-anchor="middle" font-size="12" fill="#55636e">gross ≈ 4.4–15 t · same 10 t cells</text>

  <!-- tare logic strip -->
  <rect x="24" y="500" width="956" height="124" rx="10" fill="#f6f9fc" stroke="#2f4f6f" stroke-width="1.2"/>
  <text x="40" y="524" font-weight="700" fill="#1d2b36">Zero and tare logic — no blind auto re-tare</text>
  <g font-size="12">
    <rect x="40" y="536" width="210" height="76" rx="6" fill="#ffffff" stroke="#2f80c0"/>
    <text x="50" y="555" font-weight="700" fill="#164a73">1 · Frame empty</text>
    <text x="50" y="572" fill="#33414c">no tag, stable 60 s →</text>
    <text x="50" y="588" fill="#33414c">sensor ZERO (only here)</text>
    <text x="50" y="604" fill="#33414c">shift &gt; 2 % → flag, no zero</text>
    <line x1="252" y1="574" x2="276" y2="574" stroke="#2f4f6f" marker-end="url(#arr)"/>
    <rect x="278" y="536" width="210" height="76" rx="6" fill="#ffffff" stroke="#b03030"/>
    <text x="288" y="555" font-weight="700" fill="#b03030">2 · Container docks</text>
    <text x="288" y="572" fill="#33414c">read RFID ID →</text>
    <text x="288" y="588" fill="#33414c">tare from the register</text>
    <text x="288" y="604" fill="#33414c">no tag → MODEL_ESTIMATE</text>
    <line x1="490" y1="574" x2="514" y2="574" stroke="#2f4f6f" marker-end="url(#arr)"/>
    <rect x="516" y="536" width="210" height="76" rx="6" fill="#ffffff" stroke="#3c6b2c"/>
    <text x="526" y="555" font-weight="700" fill="#3c6b2c">3 · Verified-empty return</text>
    <text x="526" y="572" fill="#33414c">ID + emptying + fill &lt; 5 %</text>
    <text x="526" y="588" fill="#33414c">within ±30 kg → update tare</text>
    <text x="526" y="604" fill="#33414c">heavier → RESIDUE flag</text>
    <line x1="728" y1="574" x2="752" y2="574" stroke="#2f4f6f" marker-end="url(#arr)"/>
    <rect x="754" y="536" width="214" height="76" rx="6" fill="#ffffff" stroke="#b07d00"/>
    <text x="764" y="555" font-weight="700" fill="#6b4c00">4 · Weigh at idle</text>
    <text x="764" y="572" fill="#33414c">net = gross − tare(ID)</text>
    <text x="764" y="588" fill="#33414c">σ ≈ 1.1 % typical,</text>
    <text x="764" y="604" fill="#33414c">2.2 % pessimistic (3 t load)</text>
  </g>
</svg>
