; Compactor sensor node: ESP32 + HX711 load cell (+ optional HC-SR04 fill sensor)
; Same setup style as the AIsmell kit. Change "board" if you use a different ESP32.

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bogde/HX711@^0.7.5
    knolleary/PubSubClient@^2.8
