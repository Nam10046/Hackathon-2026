; EDGE NODE for an ESP32-C6 board — no load cell needed (built-in simulated load cell).
; The board does the edge work for real: stable weighing, spike filter, emptying detection, offline buffer,
; signed readings, status LED. Data path: Wi-Fi -> MQTT (laptop :1883) -> Node-RED -> backend -> Grafana.
;
; Which env?
;   esp32c6      ESP32-C6-DevKitC-1, USB cable in the port marked "UART" (or the only port on boards with a USB-UART chip)
;   esp32c6_usb  boards with only the chip's own USB port (e.g. "SuperMini"), or the DevKitC port marked "USB"
; Upload:  pio run -e esp32c6 -t upload      Monitor: pio device monitor -e esp32c6

[platformio]
; the VS Code Upload button flashes only this env. Nam's board has Secure Boot + flash encryption burned in,
; so the default is the signed + encrypted upload (needs $env:SB_KEY, see secure_flash.ps1)
default_envs = esp32c6_secure

[common]
; ESP32-C6 needs Arduino core 3.x -> the community "pioarduino" platform (the official one has no Arduino for C6)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; no extra libraries: Wi-Fi, MQTT (esp-mqtt), HMAC (mbedTLS) and the RGB LED driver are all in the ESP32 core

[env:esp32c6]
extends = common
board = esp32-c6-devkitc-1

[env:esp32c6_usb]
extends = common
board = esp32-c6-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Board with Secure Boot V2 + flash encryption eFuses burned (a plain upload would stop it booting).
; Upload = build, then secure_flash.ps1 signs bootloader + app with $env:SB_KEY and writes them with --encrypt.
[env:esp32c6_secure]
extends = common
board = esp32-c6-devkitc-1
upload_port = COM4
upload_protocol = custom
upload_command = powershell -NoProfile -ExecutionPolicy Bypass -File secure_flash.ps1 -NoBuild -Env esp32c6_secure -Port $UPLOAD_PORT
