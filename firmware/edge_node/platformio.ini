; EDGE NODE for an ESP32-C6 board — no load cell needed (built-in simulated load cell).
; The board does the edge work for real: stable weighing, spike filter, emptying detection, offline buffer,
; signed readings, status LED. Data path: Wi-Fi -> MQTT (laptop :1883) -> Node-RED -> backend -> Grafana.
;
; Which env?
;   esp32c6      ESP32-C6-DevKitC-1, USB cable in the port marked "UART" (or the only port on boards with a USB-UART chip)
;   esp32c6_usb  boards with only the chip's own USB port (e.g. "SuperMini"), or the DevKitC port marked "USB"
; Upload:  pio run -e esp32c6 -t upload      Monitor: pio device monitor -e esp32c6

[common]
; ESP32-C6 needs Arduino core 3.x -> the community "pioarduino" platform (the official one has no Arduino for C6)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; no extra libraries: Wi-Fi, MQTT (esp-mqtt), HMAC (mbedTLS) and the RGB LED driver are all in the ESP32 core

[env:esp32c6]
extends = common
board = esp32-c6-devkitc-1

[env:esp32c6_usb]
extends = common
board = esp32-c6-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
