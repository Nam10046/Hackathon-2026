# Smart compactor server. Settings come from .env (copy .env.example; defaults work without it).
#
#   docker compose up -d --build     start everything
#   docker compose ps                all should be "healthy"
#   docker compose down              stop (data is kept)
#   docker compose down -v           stop and wipe all data
#
# Ports listen only on this laptop (BIND_ADDR=127.0.0.1), except MQTT,
# which the ESP32 must reach over Wi-Fi.

name: ${STACK_NAME:-compactor}

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_BIND:-0.0.0.0}:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 5s
      timeout: 10s
      retries: 5
    environment:
      - TZ=${TIMEZONE:-Europe/Helsinki}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-compactor}
      - POSTGRES_PASSWORD=${DB_PASS:-compactor}
      - POSTGRES_DB=${DB_NAME:-compactor}
      - TZ=${TIMEZONE:-Europe/Helsinki}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-compactor} -d ${DB_NAME:-compactor}"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - DATABASE_URL=postgresql+psycopg://${DB_USER:-compactor}:${DB_PASS:-compactor}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-compactor}?sslmode=${DB_SSLMODE:-disable}
      - MODELS_DIR=/models
      - INGEST_API_KEY=${INGEST_API_KEY:-}
      - DEVICE_KEYS=${DEVICE_KEYS:-}          # edge nodes that sign readings, e.g. C1:secret (firmware/edge_node)
      - DEMO_TIME_SCALE=${DEMO_TIME_SCALE:-1}        # 60 = fast demo: 1 real minute = 1 site hour (same as TIME_SCALE in firmware)
      - READING_INTERVAL_H=${READING_INTERVAL_H:-1}  # how often a sensor reports; 0.003 (~10 s) for the ESP32
      - SITE_ID=${SITE_ID:-S1}                       # the edge node listens for trucks on site/<SITE_ID>/cmd
      - TZ=${TIMEZONE:-Europe/Helsinki}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    volumes:
      - ./backend/app:/code/app      # live reload while coding
      - ./models:/models:ro          # drop trained ONNX models here
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nodered:
    image: nodered/node-red:4.0
    ports:
      - "${BIND_ADDR:-127.0.0.1}:1880:1880"
    volumes:
      - ./nodered:/data
    environment:
      - TZ=${TIMEZONE:-Europe/Helsinki}
    depends_on:
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - TZ=${TIMEZONE:-Europe/Helsinki}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true        # judges can view without login
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/compactor.json
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - DB_USER=${DB_USER:-compactor}
      - DB_PASS=${DB_PASS:-compactor}
      - DB_NAME=${DB_NAME:-compactor}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  analytics:
    # One-shot job, not started by "up". Run: docker compose run --rm analytics   (audit pipeline if needed + cockpit tables)
    build:
      context: .
      dockerfile: analytics/Dockerfile
    profiles: ["tools"]
    environment:
      - DATABASE_URL=postgresql+psycopg://${DB_USER:-compactor}:${DB_PASS:-compactor}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-compactor}?sslmode=${DB_SSLMODE:-disable}
    volumes:
      - ./europress:/work/europress:ro      # unzipped Europress dataset (git-ignored)
      - ./analytics:/work/analytics:ro
      - ./training:/work/training:ro        # lift features (shared with training)
      - ./backend:/work/backend:ro          # lift_features.py
      - ./models:/work/models:ro            # trained live lift model
      - ./audit:/work/audit                 # team audit pipeline (Task B / B2 / C2); writes audit/outputs + .snapshots
    depends_on:
      backend:
        condition: service_healthy        # backend creates action_decisions first

  adminer:
    image: adminer:latest
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mosquitto-data:
  postgres-data:
  grafana-data:
